name: Import website source
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Expand and validate website
        run: |
          python3 -m zipfile -e backstory-source.zip .
          python3 build.py
          python3 check_site.py
          node --check dist/site.js
      - name: Save editable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist build.py portfolio_updates.py check_site.py validation.json
          git diff --cached --quiet || git commit -m "Import and validate editable Backstory website"
          git push
